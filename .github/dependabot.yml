version: 2
# Temporarily pause version-update PRs; security updates remain enabled.
# Remove open-pull-requests-limit to resume the weekly schedules.
updates:
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
