# Stand-alone project for demos/mccp-multicloud-control-plane.
# It has its own .venv, so it never changes the parent repo's pyproject.toml or uv.lock.
# Local mode needs only the Python standard library; the "azure" extra powers --mode azure.

[project]
name = "mccp-demo"
version = "0.3.0"
description = "Multi-cloud AI control plane demo: inventory, agent identity, gateway token limits, FinOps and kill switch (synthetic Contoso Health data)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17",
  "azure-ai-projects>=1.0.0",          # VALIDATE: 2.x exposes agents.list(); 1.0.x agents.list_agents()
  "azure-monitor-query>=1.4",
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "httpx>=0.27",
  "requests>=2.32",
]
aws = ["boto3>=1.39"]                  # VALIDATE: bedrock-agentcore-control needs a recent boto3
okta = ["pyjwt[crypto]>=2.9"]
notebooks = ["ipykernel>=6.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mccp"]

[tool.pytest.ini_options]
testpaths = ["tests/mccp"]
pythonpath = ["src"]
